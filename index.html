<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>심플 편집기</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; 
            background: #121212; color: white; font-family: sans-serif; 
            margin: 0; padding: 10px;
        }
        
        .controls { 
            width: 100%; max-width: 500px; background: #222; padding: 15px; 
            border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 10px; box-sizing: border-box;
        }

        /* 입력창 가독성 개선 */
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; 
            background: #000; color: white; font-size: 16px; box-sizing: border-box;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        button { 
            padding: 15px; border: none; border-radius: 8px; font-weight: bold; 
            color: white; cursor: pointer; font-size: 14px;
        }
        .btn-save { background: #444; }
        .btn-copy { background: #007AFF; }

        .editor-container { 
            position: relative; width: 100%; max-width: 500px; 
            border-radius: 8px; overflow: hidden; touch-action: none;
        }
        canvas { width: 100% !important; height: auto !important; display: block; }

        .hint { margin-top: 10px; color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <input type="text" id="topText" placeholder="상단 문구 입력" value="상단 텍스트" oninput="draw()">
            <input type="text" id="bottomText" placeholder="하단 문구 입력" value="하단 텍스트" oninput="draw()">
        </div>
        
        <div class="btn-group">
            <button class="btn-save" onclick="download()">파일 저장</button>
            <button class="btn-copy" onclick="copyToClipboard()">복사</button>
        </div>
    </div>

    <div class="editor-container">
        <canvas id="canvas"></canvas>
    </div>

    <p class="hint">글자를 터치해서 이동시키세요.</p>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = 'sample.png'; 

        let texts = [
            { id: 'top', x: 0, y: 0, isDragging: false },
            { id: 'bottom', x: 0, y: 0, isDragging: false }
        ];

        img.onload = () => {
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            texts[0].x = canvas.width / 2;
            texts[0].y = canvas.height * 0.15;
            texts[1].x = canvas.width / 2;
            texts[1].y = canvas.height * 0.85;
            draw();
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            
            // 모바일 화면 크기에 맞춰 폰트 사이즈 자동 조절 (이미지 너비의 7%)
            const fontSize = canvas.width * 0.07;
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(document.getElementById('topText').value, texts[0].x, texts[0].y);
            ctx.fillText(document.getElementById('bottomText').value, texts[1].x, texts[1].y);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        const start = (e) => {
            const pos = getPos(e);
            texts.forEach(t => {
                const dist = Math.sqrt((pos.x - t.x)**2 + (pos.y - t.y)**2);
                if (dist < 150) t.isDragging = true; 
            });
        };

        const move = (e) => {
            if (!texts.some(t => t.isDragging)) return;
            if (e.cancelable) e.preventDefault();
            const pos = getPos(e);
            texts.forEach(t => {
                if (t.isDragging) { t.x = pos.x; t.y = pos.y; draw(); }
            });
        };

        const end = () => texts.forEach(t => t.isDragging = false);

        canvas.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        canvas.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);

        function download() {
            const link = document.createElement('a');
            link.download = 'image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 클립보드 복사 (모바일 호환성 강화)
        async function copyToClipboard() {
            canvas.toBlob(async (blob) => {
                try {
                    const data = [new ClipboardItem({ [blob.type]: blob })];
                    await navigator.clipboard.write(data);
                    alert("성공");
                } catch (err) {
                    // 대체 방법: 이미지를 길게 눌러서 저장하도록 안내
                    alert("이 브라우저에서는 '저장' 버튼을 이용해주세요.");
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
