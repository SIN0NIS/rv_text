<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 말풍선 편집기</title>
    <style>
        :root { --primary: #4a90e2; }
        body { display: flex; flex-direction: column; align-items: center; background: #333; color: white; font-family: sans-serif; padding: 20px; }
        
        /* 컨트롤 패널 */
        .controls { 
            background: white; color: #333; padding: 20px; border-radius: 12px; 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: bold; color: #666; }
        
        /* 편집 영역 */
        .editor-container { position: relative; cursor: crosshair; user-select: none; }
        canvas { border: 2px solid #555; max-width: 100%; height: auto; background: white; }

        button { 
            grid-column: span 2; padding: 12px; background: var(--primary); 
            color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #357abd; }
        .hint { margin-top: 10px; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <h2>말풍선 커스텀 편집기</h2>

    <div class="controls">
        <div class="control-group">
            <label>상단 문구</label>
            <input type="text" id="topText" value="여기를 드래그해서 이동" oninput="draw()">
        </div>
        <div class="control-group">
            <label>하단 문구</label>
            <input type="text" id="bottomText" value="폰트와 크기도 조절 가능" oninput="draw()">
        </div>
        <div class="control-group">
            <label>폰트 선택</label>
            <select id="fontFamily" onchange="draw()">
                <option value="sans-serif">기본 고딕</option>
                <option value="serif">명조체</option>
                <option value="cursive">손글씨풍</option>
                <option value="'Arial Black'">두꺼운 고딕</option>
                <option value="'Courier New'">타자기체</option>
            </select>
        </div>
        <div class="control-group">
            <label>글자 크기</label>
            <input type="range" id="fontSize" min="10" max="100" value="30" oninput="draw()">
        </div>
        <div class="control-group">
            <label>글자 굵기</label>
            <select id="fontWeight" onchange="draw()">
                <option value="normal">보통</option>
                <option value="bold" selected>굵게</option>
            </select>
        </div>
        <button onclick="download()">이미지로 저장하기</button>
    </div>

    <div class="editor-container">
        <canvas id="canvas"></canvas>
    </div>

    <p class="hint">💡 화면 위 글자를 마우스나 손가락으로 드래그해서 원하는 위치에 놓으세요!</p>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = 'sample.png'; // 같은 폴더의 이미지 파일명

        // 텍스트 설정 상태
        let texts = [
            { id: 'top', x: 0, y: 0, isDragging: false },
            { id: 'bottom', x: 0, y: 0, isDragging: false }
        ];

        img.onload = () => {
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            // 초기 위치 설정 (말풍선 근처)
            texts[0].x = canvas.width / 2;
            texts[0].y = canvas.height * 0.15;
            texts[1].x = canvas.width / 2;
            texts[1].y = canvas.height * 0.85;
            draw();
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            const size = document.getElementById('fontSize').value;
            const family = document.getElementById('fontFamily').value;
            const weight = document.getElementById('fontWeight').value;

            ctx.font = `${weight} ${size}px ${family}`;
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // 상단 텍스트
            ctx.fillText(document.getElementById('topText').value, texts[0].x, texts[0].y);
            // 하단 텍스트
            ctx.fillText(document.getElementById('bottomText').value, texts[1].x, texts[1].y);
        }

        // 드래그 로직
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX || e.touches[0].clientX - rect.left) * scaleX - rect.left * scaleX,
                y: (e.clientY || e.touches[0].clientY - rect.top) * scaleY - rect.top * scaleY
            };
        }

        const handleStart = (e) => {
            const pos = getMousePos(e);
            texts.forEach(t => {
                const dist = Math.sqrt((pos.x - t.x)**2 + (pos.y - t.y)**2);
                if (dist < 50) t.isDragging = true; // 텍스트 근처 클릭 시 드래그 시작
            });
        };

        const handleMove = (e) => {
            const pos = getMousePos(e);
            texts.forEach(t => {
                if (t.isDragging) {
                    t.x = pos.x;
                    t.y = pos.y;
                    draw();
                }
            });
        };

        const handleEnd = () => texts.forEach(t => t.isDragging = false);

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        
        // 터치 지원 (모바일)
        canvas.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function download() {
            const link = document.createElement('a');
            link.download = 'custom_manga.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
